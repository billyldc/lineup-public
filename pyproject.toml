[project]
name = "lineup"
version = "0.1.0"
description = "AI-driven project management tool via MCP"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]",
    "click",
]

[project.optional-dependencies]
ui = [
    "textual>=0.80",
]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-textual-snapshot>=1.0",
    "textual>=0.80",
]

[project.scripts]
lineup-server = "lineup.server:main"
lu = "lineup.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
